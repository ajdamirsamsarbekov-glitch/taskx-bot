version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskx-postgres
    environment:
      POSTGRES_DB: taskx
      POSTGRES_USER: taskx
      POSTGRES_PASSWORD: taskx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskx-network

  redis:
    image: redis:7-alpine
    container_name: taskx-redis
    ports:
      - "6379:6379"
    networks:
      - taskx-network

  minio:
    image: minio/minio:latest
    container_name: taskx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - taskx-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: taskx-api
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: taskx
      DATABASE_PASSWORD: taskx_password
      DATABASE_NAME: taskx
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOT_TOKEN: ${BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - taskx-network
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: taskx-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_URL: ${WEB_URL}
      API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - taskx-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: taskx-web
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME}
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - taskx-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: taskx-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - taskx-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  taskx-network:
    driver: bridge
